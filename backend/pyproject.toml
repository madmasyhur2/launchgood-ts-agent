[project]
name = "launchgood-ts-agent"
version = "0.1.0"
description = "LaunchGood Campaign Trust & Safety Review Agent — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database — SQLAlchemy 2.0 async + asyncpg driver
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Migrations
    "alembic>=1.13.0",
    # Pydantic v2 + settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",
    # Redis (async)
    "redis>=5.0.0",
    # Task queue
    "celery[redis]>=5.4.0",
    # Environment variables
    "python-dotenv>=1.0.0",
    # LLM — Google Gemini via LangChain (migrated from Anthropic in Session 3)
    "langchain-google-genai>=4.2.4",
    "langchain-core>=0.3.0",
    # Agent graph
    "langgraph>=0.2.0",
    # HTTP client (for future webhooks / external calls)
    "httpx>=0.27.0",
    # Date/time utilities
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",    # TestClient
    "faker>=26.0.0",    # Realistic mock data in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
