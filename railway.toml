# =============================================================================
# Railway deployment configuration — LaunchGood T&S Agent (Backend)
# =============================================================================
# This file configures the Railway service for the FastAPI backend.
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Build from the /backend subdirectory using the backend Dockerfile
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Railway injects PORT env var — uvicorn reads it via $PORT.
# Migrations run automatically before the server starts.
# The Dockerfile sets WORKDIR /app (= /backend), so paths are relative to it.
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --log-level info'"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envVars]
# These are documented — actual secret values must be set in the Railway dashboard.
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"
