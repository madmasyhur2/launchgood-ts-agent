# =============================================================================
# Railway deployment configuration — LaunchGood T&S Agent (Backend)
# =============================================================================
# This file configures the Railway service for the FastAPI backend.
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Build from the /backend subdirectory
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Railway injects PORT env var — uvicorn reads it via the CMD in Dockerfile.
# Migrations run automatically as the first CMD step (alembic upgrade head).
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --log-level info"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envVars]
# These are documented — actual values must be set in the Railway dashboard.
# See .env.example for descriptions.
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"
